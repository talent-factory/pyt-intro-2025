<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>Zeilenumbruch: write braucht \n, strip entfernt ihn beim Lesen</title>
  <defs><marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Der unsichtbare Zeilenumbruch \n</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Beim Schreiben müssen wir ihn selbst setzen, beim Lesen räumen wir ihn weg.</text>

  <!-- Schreiben -->
  <text x="240" y="125" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7de1">Schreiben</text>
  <g transform="translate(40,140)">
    <rect width="190" height="150" rx="12" fill="#ffebee" stroke="#d32f2f" stroke-width="3"/>
    <text x="95" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#d32f2f">✗ ohne \n</text>
    <g font-family="monospace" font-size="13" fill="#333"><text x="12" y="56">f.write("Erste")</text><text x="12" y="76">f.write("Zweite")</text></g>
    <rect x="12" y="92" width="166" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="95" y="118" text-anchor="middle" font-size="14" font-family="monospace" fill="#d32f2f">ErsteZweite</text>
  </g>
  <g transform="translate(250,140)">
    <rect width="190" height="150" rx="12" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="95" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e9e4f">✓ mit \n</text>
    <g font-family="monospace" font-size="13" fill="#333"><text x="12" y="56">f.write("Erste\n")</text><text x="12" y="76">f.write("Zweite\n")</text></g>
    <rect x="12" y="88" width="166" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="95" y="109" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">Erste</text>
    <text x="95" y="128" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">Zweite</text>
  </g>

  <path d="M480,120 V420" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Lesen -->
  <text x="720" y="125" text-anchor="middle" font-size="22" font-weight="bold" fill="#e1872a">Lesen</text>
  <g transform="translate(520,140)">
    <rect width="190" height="150" rx="12" fill="#ffebee" stroke="#d32f2f" stroke-width="3"/>
    <text x="95" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#d32f2f">✗ print(zeile)</text>
    <rect x="12" y="44" width="166" height="92" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <g font-family="monospace" font-size="14" fill="#333" text-anchor="middle">
      <text x="95" y="66">Erste</text><text x="95" y="84" fill="#d32f2f">(Leerzeile)</text><text x="95" y="102">Zweite</text><text x="95" y="120" fill="#d32f2f">(Leerzeile)</text>
    </g>
  </g>
  <g transform="translate(730,140)">
    <rect width="190" height="150" rx="12" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="95" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e9e4f">✓ zeile.strip()</text>
    <rect x="12" y="44" width="166" height="92" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <g font-family="monospace" font-size="14" fill="#333" text-anchor="middle">
      <text x="95" y="82">Erste</text><text x="95" y="108">Zweite</text>
    </g>
  </g>

  <g transform="translate(40,330)">
    <rect width="880" height="130" rx="14" fill="#fff" stroke="#333" stroke-width="2"/>
    <g font-size="17" fill="#333">
      <text x="24" y="38">• <tspan font-family="monospace" font-weight="bold">write()</tspan> hängt <tspan font-weight="bold">nie</tspan> von selbst einen Zeilenumbruch an. <tspan font-family="monospace">print()</tspan> tut das schon.</text>
      <text x="24" y="70">• Beim Zeilenweise-Lesen steht <tspan font-family="monospace" font-weight="bold">\n</tspan> am Ende jeder Zeile (ausser evtl. der letzten).</text>
      <text x="24" y="102">• <tspan font-family="monospace" font-weight="bold">strip()</tspan> entfernt Leerzeichen und <tspan font-family="monospace">\n</tspan> an beiden Enden.</text>
    </g>
  </g>
  <text x="480" y="508" text-anchor="middle" font-size="16" fill="#555">Typisches Muster: <tspan font-family="monospace">for zeile in f: print(zeile.strip())</tspan></text>
</svg>
