<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>csv.reader liefert Listen, csv.DictReader liefert Dictionaries</title>
  <defs><marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">reader oder DictReader?</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Dieselbe Zeile, zwei Darstellungen: per Position oder per Spaltenname.</text>

  <g transform="translate(330,110)">
    <rect width="300" height="50" rx="10" fill="#fff3e0" stroke="#e1872a" stroke-width="3"/>
    <text x="150" y="31" text-anchor="middle" font-size="15" font-family="monospace" fill="#333">Anna Muster,anna@example.com,079…</text>
  </g>
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#spitze)">
    <path d="M400,165 L250,225"/><path d="M560,165 L710,225"/>
  </g>

  <g transform="translate(40,230)">
    <rect width="420" height="230" rx="16" fill="#e3f2fd" stroke="#2a7de1" stroke-width="3"/>
    <text x="210" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7de1">csv.reader</text>
    <text x="210" y="64" text-anchor="middle" font-size="15" fill="#555">jede Zeile ist eine Liste</text>
    <rect x="20" y="80" width="380" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="210" y="111" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">['Anna Muster', 'anna@…', '079…']</text>
    <text x="30" y="165" font-size="16" font-family="monospace" fill="#333">zeile[0]  → 'Anna Muster'</text>
    <text x="30" y="195" font-size="16" font-family="monospace" fill="#333">zeile[1]  → 'anna@example.com'</text>
    <text x="30" y="218" font-size="14" fill="#555">Header bei Bedarf mit next(reader) überspringen</text>
  </g>

  <g transform="translate(500,230)">
    <rect width="420" height="230" rx="16" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="210" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e9e4f">csv.DictReader</text>
    <text x="210" y="64" text-anchor="middle" font-size="15" fill="#555">jede Zeile ist ein Dictionary</text>
    <rect x="20" y="80" width="380" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="210" y="111" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">{'Name': 'Anna Muster', 'Email': …}</text>
    <text x="30" y="165" font-size="16" font-family="monospace" fill="#333">zeile["Name"]   → 'Anna Muster'</text>
    <text x="30" y="195" font-size="16" font-family="monospace" fill="#333">zeile["Email"]  → 'anna@example.com'</text>
    <text x="30" y="218" font-size="14" fill="#555">Der Header liefert die Schlüssel automatisch</text>
  </g>
  <text x="480" y="508" text-anchor="middle" font-size="17" fill="#333"><tspan font-weight="bold">Tipp:</tspan> <tspan font-family="monospace">DictReader</tspan> ist lesbarer, weil <tspan font-family="monospace">zeile["Email"]</tspan> mehr sagt als <tspan font-family="monospace">zeile[1]</tspan>.</text>
</svg>
