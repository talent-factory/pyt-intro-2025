<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>json.dump Optionen: indent macht die Ausgabe lesbar, ensure_ascii=False erhält Umlaute</title>
  <defs><marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">indent und ensure_ascii</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Zwei Optionen von <tspan font-family="monospace">json.dump</tspan>, die die Datei besser machen.</text>

  <g transform="translate(40,110)">
    <text x="440" y="14" text-anchor="middle" font-size="21" font-weight="bold" fill="#2a7de1">indent: Lesbarkeit</text>
  </g>
  <g transform="translate(40,135)">
    <rect width="420" height="135" rx="14" fill="#ffebee" stroke="#d32f2f" stroke-width="3"/>
    <text x="210" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#d32f2f">✗ ohne indent</text>
    <text x="14" y="60" font-size="13" font-family="monospace" fill="#333">{"name": "Anna", "alter": 25,</text>
    <text x="14" y="82" font-size="13" font-family="monospace" fill="#333"> "hobbies": ["Lesen", "Sport"]}</text>
    <text x="210" y="116" text-anchor="middle" font-size="14" fill="#555">alles in einer Zeile</text>
  </g>
  <g transform="translate(500,135)">
    <rect width="420" height="135" rx="14" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="210" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e9e4f">✓ indent=2</text>
    <g font-size="13" font-family="monospace" fill="#333">
      <text x="14" y="46">{</text><text x="34" y="63">"name": "Anna",</text><text x="34" y="80">"alter": 25,</text><text x="34" y="97">"hobbies": ["Lesen", "Sport"]</text><text x="14" y="114">}</text>
    </g>
  </g>

  <g transform="translate(40,300)">
    <text x="440" y="0" text-anchor="middle" font-size="21" font-weight="bold" fill="#e1872a">ensure_ascii: Umlaute</text>
  </g>
  <g transform="translate(40,320)">
    <rect width="420" height="120" rx="14" fill="#ffebee" stroke="#d32f2f" stroke-width="3"/>
    <text x="210" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#d32f2f">✗ Standard (True)</text>
    <text x="14" y="62" font-size="13" font-family="monospace" fill="#333">{"stadt": "Z\u00fcrich"}</text>
    <text x="210" y="98" text-anchor="middle" font-size="14" fill="#555">Umlaute werden zu \u-Codes</text>
  </g>
  <g transform="translate(500,320)">
    <rect width="420" height="120" rx="14" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="210" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e9e4f">✓ ensure_ascii=False</text>
    <text x="14" y="62" font-size="13" font-family="monospace" fill="#333">{"stadt": "Zürich"}</text>
    <text x="210" y="98" text-anchor="middle" font-size="14" fill="#555">Umlaute bleiben lesbar</text>
  </g>

  <text x="480" y="478" text-anchor="middle" font-size="17" fill="#333">Empfehlung: <tspan font-family="monospace" font-weight="bold">json.dump(daten, f, indent=2, ensure_ascii=False)</tspan></text>
  <text x="480" y="510" text-anchor="middle" font-size="15" fill="#555">Beim Lesen mit <tspan font-family="monospace">json.load</tspan> macht beides keinen Unterschied: Python bekommt dieselben Daten.</text>
</svg>
