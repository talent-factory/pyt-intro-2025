<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',sans-serif">
  <title>Python Datei-Modi r, w, a auf der Schultafel: Nur Gucken, Alles NEU, Unten dran</title>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <!-- Textzeilen einer Buchseite -->
    <g id="zeilen" stroke="#8a7a5a" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 3 14 3 6 3">
      <path d="M14,22 Q60,16 118,28"/><path d="M14,40 Q60,34 118,46"/><path d="M14,58 Q60,52 118,64"/>
      <path d="M14,76 Q60,70 118,82"/><path d="M14,94 Q60,88 118,100"/><path d="M14,112 Q60,106 118,118"/>
    </g>
    <!-- Aufgeschlagenes Buch, Ursprung oben links, ca. 276 x 150 -->
    <g id="buch">
      <path d="M-8,12 L138,28 L284,12 L284,128 L138,146 L-8,128 Z" fill="#8b4a2b" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0,0 Q68,-6 138,14 L138,134 Q68,116 0,124 Z" fill="#f6ecd0" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M276,0 Q208,-6 138,14 L138,134 Q208,116 276,124 Z" fill="#f6ecd0" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <use href="#zeilen"/>
      <g transform="translate(276,0) scale(-1,1)"><use href="#zeilen"/></g>
    </g>
    <!-- Schlangen-Maskottchen, Ursprung am Boden, Kopf bei y = -95 -->
    <g id="schlange">
      <ellipse cx="-8" cy="44" rx="46" ry="13" fill="none" stroke="#111" stroke-width="28"/>
      <path d="M-40,40 C-72,8 -30,0 -20,-20 C-10,-45 -40,-60 -6,-82" fill="none" stroke="#111" stroke-width="32" stroke-linecap="round"/>
      <ellipse cx="-8" cy="44" rx="46" ry="13" fill="none" stroke="#6fbf4a" stroke-width="22"/>
      <path d="M-40,40 C-72,8 -30,0 -20,-20 C-10,-45 -40,-60 -6,-82" fill="none" stroke="#6fbf4a" stroke-width="26" stroke-linecap="round"/>
      <path d="M-20,-20 C-10,-45 -40,-60 -6,-82" fill="none" stroke="#f2e27a" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 9" opacity=".9"/>
      <g fill="#c98a3a"><circle cx="-50" cy="22" r="5"/><circle cx="-30" cy="52" r="5"/><circle cx="26" cy="46" r="5"/></g>
      <ellipse cx="8" cy="-92" rx="28" ry="21" fill="#6fbf4a" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="-100" r="9" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="20" cy="-100" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
      <circle cx="3" cy="-99" r="4" fill="#111"/><circle cx="23" cy="-99" r="4" fill="#111"/>
      <path d="M-2,-82 Q12,-72 28,-82" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M30,-82 l14,4 m-14,-4 l12,-6" stroke="#e53935" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- Tafel -->
  <rect width="1000" height="560" fill="#262a2b"/>
  <rect x="6" y="6" width="988" height="548" rx="10" fill="none" stroke="#6b5a45" stroke-width="8"/>

  <!-- Titelbanner -->
  <g>
    <path d="M200,28 L270,28 L270,84 L200,84 L222,56 Z" fill="#a9c4cf" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M800,28 L730,28 L730,84 L800,84 L778,56 Z" fill="#a9c4cf" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <rect x="250" y="16" width="500" height="76" rx="4" fill="#dcedf2" stroke="#111" stroke-width="3"/>
    <text x="500" y="49" text-anchor="middle" font-size="27" font-weight="bold" fill="#1b1b1b">Python Datei-Modi:</text>
    <text x="500" y="79" text-anchor="middle" font-size="27" font-weight="bold" fill="#1b1b1b">Verstehen von r, w, a</text>
  </g>

  <!-- Trennlinien -->
  <g stroke="#cfcfcf" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"><path d="M333,130 V490"/><path d="M666,130 V490"/></g>

  <!-- Modus-Überschriften -->
  <g font-size="52" font-weight="bold" fill="#f2d65a" text-anchor="middle">
    <text x="167" y="150">‘r’</text><text x="500" y="150">‘w’</text><text x="833" y="150">‘a’</text>
  </g>
  <g stroke="#f2d65a" stroke-width="3" stroke-linecap="round"><path d="M135,162 H199"/><path d="M468,162 H532"/><path d="M801,162 H865"/></g>

  <!-- ============ Spalte r ============ -->
  <g>
    <use href="#buch" transform="translate(36,325)"/>
    <!-- Mauszeiger -->
    <path d="M70,348 l0,26 l7,-7 l5,12 l5,-2 l-5,-12 l10,0 z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
    <use href="#schlange" transform="translate(150,330)"/>
    <!-- Brille -->
    <g fill="#bfe6ff" fill-opacity=".5" stroke="#111" stroke-width="3">
      <circle cx="150" cy="230" r="13"/><circle cx="170" cy="230" r="13"/>
    </g>
    <path d="M163,230 h-0" stroke="#111" stroke-width="3"/>
    <!-- Lupe -->
    <g transform="translate(205,318)">
      <path d="M0,0 L28,28" stroke="#111" stroke-width="10" stroke-linecap="round"/><path d="M0,0 L28,28" stroke="#8b4a2b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-8" cy="-8" r="24" fill="#bfe6ff" fill-opacity=".75" stroke="#111" stroke-width="5"/>
      <path d="M-22,-12 Q-18,-24 -6,-26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Denkblase -->
    <g>
      <circle cx="112" cy="232" r="4" fill="#fff"/><circle cx="102" cy="222" r="6" fill="#fff"/>
      <path d="M22,200 Q14,170 46,172 Q56,152 84,162 Q112,150 122,178 Q144,192 124,214 Q110,226 84,218 Q52,230 30,216 Q16,212 22,200 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(52,193)"><path d="M-14,0 Q0,-12 14,0 Q0,12 -14,0 Z" fill="#fff" stroke="#111" stroke-width="2"/><circle r="6" fill="#2a7de1" stroke="#111" stroke-width="2"/><circle r="2.5" fill="#111"/></g>
      <text x="70" y="198" font-size="13" font-weight="bold" fill="#111" font-family="monospace">read()</text>
    </g>
    <!-- Schild -->
    <g>
      <rect x="270" y="262" width="7" height="90" fill="#8b4a2b" stroke="#111" stroke-width="2"/>
      <g transform="translate(236,176) rotate(6)">
        <rect width="92" height="76" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="46" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#111" transform="rotate(-4 46 20)">NO TOUCHING!</text>
        <circle cx="46" cy="50" r="19" fill="#ffe0d6" stroke="#d32f2f" stroke-width="5"/>
        <rect x="38" y="42" width="16" height="14" rx="4" fill="#f6c9a8" stroke="#111" stroke-width="1.5"/>
        <path d="M40,43 v-8 M45,42 v-10 M50,42 v-9 M55,44 v-7" stroke="#f6c9a8" stroke-width="4" stroke-linecap="round"/>
        <path d="M32,64 L60,36" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <path d="M296,275 Q320,310 302,345" fill="none" stroke="#8fd16a" stroke-width="4" stroke-linecap="round" marker-end="url(#spitze)" color="#8fd16a" style="stroke:#8fd16a"/>
  </g>

  <!-- ============ Spalte w ============ -->
  <g>
    <!-- zerstörtes Buch -->
    <g transform="translate(362,365) scale(.78) rotate(-4)" opacity=".95">
      <path d="M-8,12 L138,28 L284,12 L284,128 L138,146 L-8,128 Z" fill="#6b4a33" stroke="#111" stroke-width="3"/>
      <path d="M0,0 Q68,-6 138,14 L138,134 Q68,116 0,124 Z" fill="#cdb98f" stroke="#111" stroke-width="3"/>
      <path d="M276,0 Q208,-6 138,14 L138,134 Q208,116 276,124 Z" fill="#cdb98f" stroke="#111" stroke-width="3"/>
      <path d="M20,60 l14,-8 l8,12 l12,-10 M170,50 l18,10 l-6,12 l16,4" fill="none" stroke="#5a4630" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g fill="#cdb98f" stroke="#111" stroke-width="1.5"><circle cx="352" cy="352" r="6"/><circle cx="370" cy="342" r="4"/><circle cx="345" cy="372" r="3"/></g>
    <!-- Radiergummi -->
    <g transform="translate(405,255) rotate(-28)">
      <rect x="0" y="0" width="70" height="108" rx="12" fill="#e45b5b" stroke="#111" stroke-width="3"/>
      <path d="M0,50 V12 Q0,0 12,0 H58 Q70,0 70,12 V50 Z" fill="#4f7fd6" stroke="#111" stroke-width="3"/>
      <circle cx="24" cy="26" r="4" fill="#111"/><circle cx="46" cy="26" r="4" fill="#111"/>
      <path d="M22,36 Q35,46 48,36" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Dampfwalze -->
    <g transform="translate(470,215)">
      <path d="M118,20 q10,-18 28,-12 q8,-16 26,-6" fill="#ddd" stroke="#111" stroke-width="2.5"/>
      <rect x="80" y="26" width="64" height="58" rx="6" fill="#f2b630" stroke="#111" stroke-width="3"/>
      <rect x="90" y="34" width="44" height="30" rx="4" fill="#bfe6ff" stroke="#111" stroke-width="2.5"/>
      <rect x="76" y="84" width="124" height="22" rx="6" fill="#f2b630" stroke="#111" stroke-width="3"/>
      <rect x="148" y="48" width="12" height="4" fill="#111"/><rect x="164" y="30" width="6" height="40" fill="#555" stroke="#111" stroke-width="2"/>
      <circle cx="176" cy="88" r="24" fill="#333" stroke="#111" stroke-width="3"/><circle cx="176" cy="88" r="10" fill="#f2b630" stroke="#111" stroke-width="2"/>
      <rect x="-6" y="50" width="104" height="62" rx="30" fill="#b5bcc0" stroke="#111" stroke-width="3"/>
      <text x="46" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#111" transform="rotate(-4 46 87)">OVERWRITE!</text>
    </g>
    <!-- Warnschild -->
    <g transform="translate(398,395)">
      <path d="M32,0 L64,60 H0 Z" fill="#f6c52b" stroke="#d32f2f" stroke-width="6" stroke-linejoin="round"/>
      <rect x="29" y="20" width="6" height="22" rx="3" fill="#111"/><circle cx="32" cy="50" r="3.5" fill="#111"/>
    </g>
    <path d="M385,372 Q372,402 395,422" fill="none" stroke="#f0a43a" stroke-width="4" stroke-linecap="round" marker-end="url(#spitze)" style="stroke:#f0a43a" color="#f0a43a"/>
    <!-- Schriftrolle -->
    <g transform="translate(505,380)">
      <path d="M12,0 H92 V86 Q92,98 80,100 H12 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M12,0 Q-6,0 -6,10 Q-6,20 12,20" fill="#f1e8d0" stroke="#111" stroke-width="3"/>
      <path d="M26,30 H78 M26,46 H70" stroke="#2a7de1" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
      <path d="M52,12 l0,22 l6,-6 l4,10 l4,-2 l-4,-10 l9,0 z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- Bauarbeiter-Schlange -->
    <g transform="translate(632,452) scale(.78)">
      <use href="#schlange"/>
      <path d="M-18,-110 Q8,-140 36,-110 Z" fill="#f2b630" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-22" y="-112" width="62" height="8" rx="4" fill="#f2b630" stroke="#111" stroke-width="3"/>
      <circle cx="-30" cy="-72" r="9" fill="#6fbf4a" stroke="#111" stroke-width="3"/>
      <path d="M-34,-70 L-70,-30" stroke="#2a7de1" stroke-width="6" stroke-linecap="round"/>
    </g>
      </g>

  <!-- ============ Spalte a ============ -->
  <g>
    <use href="#buch" transform="translate(696,300)"/>
    <!-- Plus -->
    <g transform="translate(955,300)"><circle r="22" fill="#2a7de1" stroke="#fff" stroke-width="4"/><path d="M-11,0 H11 M0,-11 V11" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
    <!-- roter Pfeil nach unten -->
    <path d="M818,262 Q850,290 838,348" fill="none" stroke="#e8554e" stroke-width="7" stroke-linecap="round" marker-end="url(#spitze)" style="stroke:#e8554e" color="#e8554e"/>
    <path d="M790,360 L790,395" fill="none" stroke="#e8554e" stroke-width="6" stroke-linecap="round" marker-end="url(#spitze)" style="stroke:#e8554e" color="#e8554e"/>
    <text x="842" y="405" font-size="17" font-weight="bold" fill="#111" transform="rotate(-8 842 405)">neue</text>
    <text x="850" y="426" font-size="17" font-weight="bold" fill="#111" transform="rotate(-8 850 426)">Zeile...</text>
    <!-- Schlange mit Stift -->
    <g transform="translate(935,452) scale(.74)">
      <use href="#schlange"/>
      <circle cx="-34" cy="-56" r="9" fill="#6fbf4a" stroke="#111" stroke-width="3"/>
      <g transform="translate(-34,-56) rotate(-35)"><rect x="-4" y="-34" width="9" height="40" rx="3" fill="#2a7de1" stroke="#111" stroke-width="2.5"/><path d="M-4,6 L0.5,16 L5,6 Z" fill="#f2e27a" stroke="#111" stroke-width="2"/></g>
    </g>
      </g>

  <!-- Wegweiser-Pfeile unten -->
  <g fill="none" stroke="#6fb5e6" stroke-width="5" stroke-linecap="round" marker-end="url(#spitze)" color="#6fb5e6" style="stroke:#6fb5e6">
    <path d="M296,500 Q326,516 358,502"/><path d="M676,508 Q698,520 722,510"/>
  </g>

  <!-- Bildunterschriften -->
  <g font-size="21" font-weight="bold" text-anchor="middle" xml:space="preserve">
    <text x="167" y="542"><tspan fill="#8fd16a">READ (‘r’)</tspan><tspan fill="#fff">&#160;-&#160;Nur Gucken!</tspan></text>
    <text x="500" y="542"><tspan fill="#f2d65a">WRITE (‘w’)</tspan><tspan fill="#fff">&#160;-&#160;Alles&#160;</tspan><tspan fill="#e8554e">NEU!</tspan></text>
    <text x="833" y="542"><tspan fill="#8fd16a">APPEND (‘a’)</tspan><tspan fill="#fff">&#160;-&#160;Unten dran!</tspan></text>
  </g>
</svg>
