<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>Drei Arten, ein Modul zu importieren: ganz, einzelne Funktionen, mit Alias</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Module importieren: Werkzeugkasten öffnen</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Ein Modul ist ein Werkzeugkasten mit fertigen Funktionen. Drei Wege führen hinein.</text>

  <!-- Werkzeugkasten -->
  <g transform="translate(40,160)">
    <path d="M60,20 V0 H150 V20" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect y="20" width="210" height="230" rx="16" fill="#ffd966" stroke="#333" stroke-width="3"/>
    <rect y="20" width="210" height="50" rx="16" fill="#f4b942" stroke="#333" stroke-width="3"/>
    <rect x="90" y="60" width="30" height="24" rx="5" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="105" y="55" text-anchor="middle" font-size="26" font-weight="bold" font-family="monospace" fill="#333">math</text>
    <g font-family="monospace" font-size="18" fill="#333">
      <rect x="22" y="105" width="166" height="32" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="105" y="128" text-anchor="middle">pi</text>
      <rect x="22" y="147" width="166" height="32" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="105" y="170" text-anchor="middle">sqrt()</text>
      <rect x="22" y="189" width="166" height="32" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="105" y="212" text-anchor="middle">sin() ...</text>
    </g>
  </g>

  <!-- Pfeile -->
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#pfeil)">
    <path d="M255,240 C275,200 280,185 300,175"/>
    <path d="M255,290 H298"/>
    <path d="M255,340 C275,380 280,395 300,405"/>
  </g>

  <!-- Karte 1 -->
  <g transform="translate(305,115)">
    <rect width="620" height="120" rx="14" fill="#e3f2fd" stroke="#2a7de1" stroke-width="3"/>
    <text x="22" y="42" font-size="22" font-weight="bold" font-family="monospace" fill="#2a7de1">import math</text>
    <text x="22" y="76" font-size="17" fill="#333">Der ganze Kasten kommt mit.</text>
    <text x="22" y="100" font-size="17" fill="#555">Zugriff immer mit Präfix.</text>
    <text x="400" y="34" font-size="15" fill="#555">Aufruf:</text>
    <rect x="400" y="44" width="200" height="40" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="500" y="71" text-anchor="middle" font-size="19" font-family="monospace" fill="#333">math.sqrt(16)</text>
    <text x="500" y="106" text-anchor="middle" font-size="15" fill="#2a7de1">Herkunft bleibt sichtbar</text>
  </g>

  <!-- Karte 2 -->
  <g transform="translate(305,245)">
    <rect width="620" height="120" rx="14" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="22" y="42" font-size="22" font-weight="bold" font-family="monospace" fill="#2e9e4f">from math import pi, sqrt</text>
    <text x="22" y="76" font-size="17" fill="#333">Nur einzelne Werkzeuge werden</text>
    <text x="22" y="100" font-size="17" fill="#555">herausgenommen.</text>
    <text x="400" y="34" font-size="15" fill="#555">Aufruf:</text>
    <rect x="400" y="44" width="200" height="40" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="500" y="71" text-anchor="middle" font-size="19" font-family="monospace" fill="#333">sqrt(16)</text>
    <text x="500" y="106" text-anchor="middle" font-size="15" fill="#2e9e4f">Kürzer, ohne Präfix</text>
  </g>

  <!-- Karte 3 -->
  <g transform="translate(305,375)">
    <rect width="620" height="120" rx="14" fill="#fff3e0" stroke="#e1872a" stroke-width="3"/>
    <text x="22" y="42" font-size="22" font-weight="bold" font-family="monospace" fill="#e1872a">import datetime as dt</text>
    <text x="22" y="76" font-size="17" fill="#333">Der Kasten bekommt einen</text>
    <text x="22" y="100" font-size="17" fill="#555">Kurznamen (Alias).</text>
    <text x="400" y="34" font-size="15" fill="#555">Aufruf:</text>
    <rect x="400" y="44" width="200" height="40" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="500" y="71" text-anchor="middle" font-size="19" font-family="monospace" fill="#333">dt.date.today()</text>
    <text x="500" y="106" text-anchor="middle" font-size="15" fill="#e1872a">Spart Tipparbeit</text>
  </g>

  <text x="480" y="535" text-anchor="middle" font-size="17" fill="#555">Faustregel: Im Zweifel <tspan font-family="monospace">import modul</tspan>, so bleibt klar, woher eine Funktion stammt.</text>
</svg>
