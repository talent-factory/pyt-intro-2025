<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>Verschachtelte JSON-Daten Schritt für Schritt auspacken</title>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Verschachtelt: Wie Matroschka-Puppen</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Mit jeder eckigen Klammer packst du eine Schicht aus.</text>

  <!-- Matroschka links -->
  <rect x="40" y="105" width="450" height="395" rx="16" fill="#f3e5f5" stroke="#8e44ad" stroke-width="3"/>
  <text x="58" y="132" font-size="18" font-weight="bold" fill="#8e44ad">kurs <tspan font-weight="normal" fill="#555">(dict)</tspan></text>
  <text x="58" y="160" font-size="16" font-family="monospace" fill="#333">"name": "Python Basics"</text>
  <text x="58" y="184" font-size="16" font-family="monospace" fill="#333">"dauer_wochen": 5</text>

  <rect x="60" y="200" width="410" height="285" rx="14" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
  <text x="78" y="226" font-size="18" font-weight="bold" fill="#2e9e4f">"teilnehmer" <tspan font-weight="normal" fill="#555">(Liste)</tspan></text>

  <!-- Teilnehmer 0 -->
  <rect x="80" y="238" width="370" height="114" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="96" y="262" font-size="17" font-weight="bold" fill="#333">[0] <tspan font-weight="normal" fill="#555">(dict)</tspan></text>
  <text x="96" y="284" font-size="15" font-family="monospace" fill="#333">"name": "Anna"</text>
  <rect x="94" y="294" width="342" height="26" rx="6" fill="#fff3e0" stroke="#e1872a" stroke-width="3"/>
  <text x="104" y="313" font-size="15" font-family="monospace" fill="#333">"noten": [5.5, <tspan font-weight="bold" fill="#e1872a">6.0</tspan>, 5.0]</text>
  <text x="96" y="342" font-size="15" font-family="monospace" fill="#333">"anwesend": True</text>

  <!-- Teilnehmer 1 -->
  <rect x="80" y="364" width="370" height="108" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="96" y="388" font-size="17" font-weight="bold" fill="#333">[1] <tspan font-weight="normal" fill="#555">(dict)</tspan></text>
  <text x="96" y="412" font-size="15" font-family="monospace" fill="#333">"name": "Max"</text>
  <text x="96" y="436" font-size="15" font-family="monospace" fill="#333">"noten": [4.5, 5.0, 5.5]</text>
  <text x="96" y="460" font-size="15" font-family="monospace" fill="#333">"anwesend": True</text>

  <!-- Schritte rechts -->
  <text x="725" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Schicht für Schicht auspacken</text>

  <g transform="translate(530,140)">
    <rect width="400" height="62" rx="10" fill="#f3e5f5" stroke="#8e44ad" stroke-width="3"/>
    <text x="14" y="26" font-size="16" font-weight="bold" font-family="monospace" fill="#333">kurs</text>
    <text x="14" y="50" font-size="15" fill="#555">das ganze Dictionary</text>
  </g>
  <path d="M730,204 V218" stroke="#333" stroke-width="3" marker-end="url(#spitze)"/>
  <g transform="translate(530,220)">
    <rect width="400" height="62" rx="10" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="14" y="26" font-size="16" font-weight="bold" font-family="monospace" fill="#333">kurs["teilnehmer"]</text>
    <text x="14" y="50" font-size="15" fill="#555">Liste mit 2 Personen</text>
  </g>
  <path d="M730,284 V298" stroke="#333" stroke-width="3" marker-end="url(#spitze)"/>
  <g transform="translate(530,300)">
    <rect width="400" height="62" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="14" y="26" font-size="16" font-weight="bold" font-family="monospace" fill="#333">kurs["teilnehmer"][0]</text>
    <text x="14" y="50" font-size="15" fill="#555">Anna (ein Dictionary)</text>
  </g>
  <path d="M730,364 V378" stroke="#333" stroke-width="3" marker-end="url(#spitze)"/>
  <g transform="translate(530,380)">
    <rect width="400" height="62" rx="10" fill="#fff3e0" stroke="#e1872a" stroke-width="3"/>
    <text x="14" y="26" font-size="16" font-weight="bold" font-family="monospace" fill="#333">kurs["teilnehmer"][0]["noten"]</text>
    <text x="14" y="50" font-size="15" fill="#555">[5.5, 6.0, 5.0]</text>
  </g>
  <path d="M730,444 V458" stroke="#333" stroke-width="3" marker-end="url(#spitze)"/>
  <g transform="translate(530,460)">
    <rect width="400" height="62" rx="10" fill="#fff3e0" stroke="#e1872a" stroke-width="4"/>
    <text x="14" y="26" font-size="16" font-weight="bold" font-family="monospace" fill="#333">kurs["teilnehmer"][0]["noten"][1]</text>
    <text x="14" y="50" font-size="16" font-weight="bold" fill="#e1872a">6.0</text>
  </g>

  <text x="265" y="530" text-anchor="middle" font-size="15" fill="#555">Zähler beginnen bei 0: Anna ist <tspan font-family="monospace">[0]</tspan>.</text>
</svg>
