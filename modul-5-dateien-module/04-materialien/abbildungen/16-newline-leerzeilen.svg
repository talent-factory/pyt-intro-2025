<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>newline="" verhindert Leerzeilen beim Schreiben von CSV-Dateien</title>
  <defs><marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Warum newline="" ?</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Das csv-Modul kümmert sich selbst um die Zeilenenden. Python soll nicht dazwischenfunken.</text>

  <g transform="translate(40,120)">
    <rect width="420" height="270" rx="16" fill="#ffebee" stroke="#d32f2f" stroke-width="3"/>
    <text x="210" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#d32f2f">✗ Ohne newline=""</text>
    <text x="210" y="66" text-anchor="middle" font-size="15" font-family="monospace" fill="#333">open("a.csv", "w")</text>
    <rect x="60" y="86" width="300" height="160" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <g font-family="monospace" font-size="16" fill="#333">
      <text x="80" y="116">Name,Alter</text>
      <text x="80" y="146" fill="#d32f2f">(leere Zeile)</text>
      <text x="80" y="176">Anna,25</text>
      <text x="80" y="206" fill="#d32f2f">(leere Zeile)</text>
      <text x="80" y="236">Max,30</text>
    </g>
  </g>

  <g transform="translate(500,120)">
    <rect width="420" height="270" rx="16" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="210" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e9e4f">✓ Mit newline=""</text>
    <text x="210" y="66" text-anchor="middle" font-size="15" font-family="monospace" fill="#333">open("a.csv", "w", newline="")</text>
    <rect x="60" y="86" width="300" height="160" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <g font-family="monospace" font-size="16" fill="#333">
      <text x="80" y="136">Name,Alter</text>
      <text x="80" y="176">Anna,25</text>
      <text x="80" y="216">Max,30</text>
    </g>
  </g>

  <g transform="translate(40,420)">
    <rect width="880" height="80" rx="14" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="440" y="34" text-anchor="middle" font-size="18" fill="#333"><tspan font-weight="bold">Merksatz:</tspan> Beim <tspan font-weight="bold">Schreiben</tspan> von CSV immer <tspan font-family="monospace" font-weight="bold">newline=""</tspan> angeben.</text>
    <text x="440" y="62" text-anchor="middle" font-size="16" fill="#555">Besonders unter Windows entstehen sonst doppelte Zeilenumbrüche, also Leerzeilen.</text>
  </g>
</svg>
