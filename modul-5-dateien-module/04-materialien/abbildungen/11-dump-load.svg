<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>Die vier JSON-Funktionen: dump und load für Dateien, dumps und loads für Strings</title>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">dump, load, dumps, loads: Was ist was?</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Das <tspan font-family="monospace" font-weight="bold">s</tspan> am Ende steht für <tspan font-weight="bold">String</tspan>: ohne s geht es in oder aus einer Datei.</text>

  <!-- Python-Objekt -->
  <g transform="translate(40,190)">
    <rect width="240" height="170" rx="16" fill="#e3f2fd" stroke="#2a7de1" stroke-width="3"/>
    <text x="120" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7de1">Python-Objekt</text>
    <text x="120" y="66" text-anchor="middle" font-size="15" fill="#555">dict oder list</text>
    <rect x="22" y="84" width="196" height="66" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="34" y="108" font-size="15" font-family="monospace" fill="#333">person = {</text>
    <text x="50" y="128" font-size="15" font-family="monospace" fill="#333">"name": "Anna"</text>
    <text x="34" y="145" font-size="15" font-family="monospace" fill="#333">}</text>
  </g>

  <!-- Datei -->
  <g transform="translate(680,110)">
    <rect width="250" height="120" rx="16" fill="#fff3e0" stroke="#e1872a" stroke-width="3"/>
    <text x="125" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#e1872a">Datei</text>
    <text x="125" y="70" text-anchor="middle" font-size="18" font-family="monospace" fill="#333">person.json</text>
    <text x="125" y="98" text-anchor="middle" font-size="15" fill="#555">liegt auf der Festplatte</text>
  </g>

  <!-- String -->
  <g transform="translate(680,330)">
    <rect width="250" height="120" rx="16" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="125" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e9e4f">JSON-String</text>
    <text x="125" y="70" text-anchor="middle" font-size="16" font-family="monospace" fill="#333">'{"name": "Anna"}'</text>
    <text x="125" y="98" text-anchor="middle" font-size="15" fill="#555">Text im Arbeitsspeicher</text>
  </g>

  <!-- Pfeile Datei -->
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#spitze)">
    <path d="M290,225 L670,160"/>
    <path d="M670,195 L290,260"/>
  </g>
  <!-- Pfeile String -->
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#spitze)">
    <path d="M290,290 L670,365"/>
    <path d="M670,400 L290,325"/>
  </g>

  <!-- Beschriftungen -->
  <g font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="365" y="167" width="230" height="30" rx="15" fill="#fff" stroke="#e1872a" stroke-width="2"/>
    <text x="480" y="187" fill="#e1872a">json.dump(person, f)</text>
    <rect x="365" y="213" width="230" height="30" rx="15" fill="#fff" stroke="#e1872a" stroke-width="2"/>
    <text x="480" y="233" fill="#e1872a">person = json.load(f)</text>
    <rect x="345" y="313" width="270" height="30" rx="15" fill="#fff" stroke="#2e9e4f" stroke-width="2"/>
    <text x="480" y="333" fill="#2e9e4f">text = json.dumps(person)</text>
    <rect x="345" y="349" width="270" height="30" rx="15" fill="#fff" stroke="#2e9e4f" stroke-width="2"/>
    <text x="480" y="369" fill="#2e9e4f">person = json.loads(text)</text>
  </g>

  <text x="480" y="490" text-anchor="middle" font-size="17" fill="#333"><tspan font-weight="bold">Speichern</tspan> = Python → JSON (Serialisierung) · <tspan font-weight="bold">Laden</tspan> = JSON → Python (Deserialisierung)</text>
  <text x="480" y="522" text-anchor="middle" font-size="16" fill="#555">Dateien immer mit <tspan font-family="monospace">with open(...)</tspan> öffnen, <tspan font-family="monospace">indent=2</tspan> macht die Ausgabe lesbar.</text>
</svg>
