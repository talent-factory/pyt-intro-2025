<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>if __name__ == "__main__": Direkt gestartet läuft der Block, importiert wird er übersprungen</title>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Wer hat die Datei gestartet?</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Python setzt <tspan font-family="monospace">__name__</tspan> je nachdem, ob die Datei gestartet oder importiert wird.</text>

  <!-- Links: direkt gestartet -->
  <g transform="translate(30,110)">
    <rect width="430" height="410" rx="20" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="215" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e9e4f">Fall 1: direkt gestartet</text>
    <rect x="60" y="58" width="310" height="38" rx="19" fill="#1e1e1e"/>
    <text x="215" y="83" text-anchor="middle" font-size="17" font-family="monospace" fill="#fff">$ python gruss.py</text>
    <path d="M215,100 V120" stroke="#333" stroke-width="3" marker-end="url(#pfeil)"/>
    <text x="215" y="145" text-anchor="middle" font-size="18" fill="#333"><tspan font-family="monospace">__name__</tspan> ist <tspan font-family="monospace" font-weight="bold" fill="#2e9e4f">"__main__"</tspan></text>

    <rect x="30" y="165" width="370" height="170" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="48" y="195" font-size="17" font-family="monospace" fill="#333"><tspan fill="#2a7de1" font-weight="bold">def</tspan> gruesse(name):</text>
    <text x="76" y="220" font-size="17" font-family="monospace" fill="#333"><tspan fill="#2a7de1" font-weight="bold">return</tspan> f"Hallo {name}!"</text>
    <rect x="40" y="238" width="350" height="86" rx="8" fill="#c8e6c9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="52" y="266" font-size="17" font-family="monospace" fill="#333"><tspan fill="#2a7de1" font-weight="bold">if</tspan> __name__ == "__main__":</text>
    <text x="80" y="296" font-size="17" font-family="monospace" fill="#333">print(gruesse("Welt"))</text>

    <text x="215" y="364" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e9e4f">Block wird ausgeführt</text>
    <text x="215" y="390" text-anchor="middle" font-size="17" font-family="monospace" fill="#333">Hallo Welt!</text>
  </g>

  <!-- Rechts: importiert -->
  <g transform="translate(500,110)">
    <rect width="430" height="410" rx="20" fill="#f3f3f3" stroke="#888" stroke-width="3"/>
    <text x="215" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">Fall 2: importiert</text>
    <rect x="60" y="58" width="310" height="38" rx="19" fill="#1e1e1e"/>
    <text x="215" y="83" text-anchor="middle" font-size="17" font-family="monospace" fill="#fff">import gruss</text>
    <path d="M215,100 V120" stroke="#333" stroke-width="3" marker-end="url(#pfeil)"/>
    <text x="215" y="145" text-anchor="middle" font-size="18" fill="#333"><tspan font-family="monospace">__name__</tspan> ist <tspan font-family="monospace" font-weight="bold" fill="#c0392b">"gruss"</tspan></text>

    <rect x="30" y="165" width="370" height="170" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="48" y="195" font-size="17" font-family="monospace" fill="#333"><tspan fill="#2a7de1" font-weight="bold">def</tspan> gruesse(name):</text>
    <text x="76" y="220" font-size="17" font-family="monospace" fill="#333"><tspan fill="#2a7de1" font-weight="bold">return</tspan> f"Hallo {name}!"</text>
    <rect x="40" y="238" width="350" height="86" rx="8" fill="#eee" stroke="#999" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="52" y="266" font-size="17" font-family="monospace" fill="#999"><tspan font-weight="bold">if</tspan> __name__ == "__main__":</text>
    <text x="80" y="296" font-size="17" font-family="monospace" fill="#999">print(gruesse("Welt"))</text>

    <text x="215" y="364" text-anchor="middle" font-size="19" font-weight="bold" fill="#c0392b">Block wird übersprungen</text>
    <text x="215" y="390" text-anchor="middle" font-size="17" fill="#333">gruesse() steht trotzdem zur Verfügung</text>
  </g>

  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
  </defs>
  <text x="480" y="545" text-anchor="middle" font-size="17" fill="#555">Darum gehören Testläufe und Demos in diesen Block: Sie stören beim Import nicht.</text>
</svg>
