<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif">
  <title>Drei Arten, eine Datei zu lesen: read, Zeile für Zeile und readlines</title>
  <defs><marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
  <rect width="960" height="560" fill="#fffbe9"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Eine Datei lesen: drei Wege</text>
  <text x="480" y="78" text-anchor="middle" font-size="17" fill="#555">Gleiche Datei, drei verschiedene Ergebnisse.</text>

  <g transform="translate(330,105)">
    <rect width="300" height="100" rx="12" fill="#fff3e0" stroke="#e1872a" stroke-width="3"/>
    <text x="150" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#e1872a">datei.txt</text>
    <g font-family="monospace" font-size="15" fill="#333">
      <text x="30" y="52">Hallo\n</text><text x="30" y="72">Welt\n</text><text x="30" y="92">Python</text>
    </g>
  </g>
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#spitze)">
    <path d="M360,205 L190,270"/><path d="M480,205 L480,270"/><path d="M600,205 L770,270"/>
  </g>

  <g transform="translate(40,275)">
    <rect width="280" height="215" rx="16" fill="#e3f2fd" stroke="#2a7de1" stroke-width="3"/>
    <text x="140" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a7de1">f.read()</text>
    <text x="140" y="60" text-anchor="middle" font-size="15" fill="#555">alles als ein String</text>
    <rect x="20" y="78" width="240" height="46" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="140" y="107" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">'Hallo\nWelt\nPython'</text>
    <text x="140" y="158" text-anchor="middle" font-size="15" fill="#333">Gut für: kurze Dateien,</text>
    <text x="140" y="180" text-anchor="middle" font-size="15" fill="#333">den ganzen Text suchen</text>
  </g>
  <g transform="translate(340,275)">
    <rect width="280" height="215" rx="16" fill="#e8f5e9" stroke="#2e9e4f" stroke-width="3"/>
    <text x="140" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e9e4f">for zeile in f:</text>
    <text x="140" y="60" text-anchor="middle" font-size="15" fill="#555">eine Zeile nach der anderen</text>
    <g font-family="monospace" font-size="14" fill="#333" text-anchor="middle">
      <rect x="20" y="78" width="240" height="26" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="140" y="96">'Hallo\n'</text>
      <rect x="20" y="110" width="240" height="26" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="140" y="128">'Welt\n'</text>
      <rect x="20" y="142" width="240" height="26" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="140" y="160">'Python'</text>
    </g>
    <text x="140" y="190" text-anchor="middle" font-size="15" fill="#333">Gut für: grosse Dateien</text>
  </g>
  <g transform="translate(640,275)">
    <rect width="280" height="215" rx="16" fill="#f3e5f5" stroke="#8e44ad" stroke-width="3"/>
    <text x="140" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#8e44ad">f.readlines()</text>
    <text x="140" y="60" text-anchor="middle" font-size="15" fill="#555">alle Zeilen als Liste</text>
    <rect x="20" y="78" width="240" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="140" y="104" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">['Hallo\n', 'Welt\n',</text>
    <text x="140" y="124" text-anchor="middle" font-size="14" font-family="monospace" fill="#333"> 'Python']</text>
    <text x="140" y="164" text-anchor="middle" font-size="15" fill="#333">Gut für: zählen, sortieren,</text>
    <text x="140" y="186" text-anchor="middle" font-size="15" fill="#333">mit Index zugreifen</text>
  </g>
  <text x="480" y="526" text-anchor="middle" font-size="16" fill="#555">Alle drei innerhalb von <tspan font-family="monospace">with open("datei.txt", "r") as f:</tspan> verwenden.</text>
</svg>
